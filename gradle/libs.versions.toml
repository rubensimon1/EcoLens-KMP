[versions]
agp = "8.6.0"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.8.2"
androidx-appcompat = "1.7.1"
androidx-core = "1.13.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.8.2"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.7.3"
junit = "4.13.2"
kotlin = "2.1.0"
material3 = "1.3.1"
androidx-navigation = "2.8.0-alpha11"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatform" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# ── Supabase KMP v3 ──────────────────────────────────────────────────────────
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version = "3.0.3" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version = "3.0.3" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt", version = "3.0.3" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt", version = "3.0.3" }

# ── Ktor v3 ──────────────────────────────────────────────────────────────────
ktor-client-core = { module = "io.ktor:ktor-client-core", version = "3.0.0" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version = "3.0.0" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version = "3.0.0" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version = "3.0.0" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version = "3.0.0" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version = "3.0.0" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version = "3.0.0" }

# ── Kotlinx ──────────────────────────────────────────────────────────────────
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.9.0" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.6.1" }

# ── Multiplatform Settings (reemplaza SharedPreferences) ─────────────────────
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version = "1.2.0" }
multiplatform-settings-noarg = { module = "com.russhwolf:multiplatform-settings-no-arg", version = "1.2.0" }

# ── Coil 3 (imagen async KMP) ────────────────────────────────────────────────
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.0.4" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version = "3.0.4" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version = "17.2.0" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }